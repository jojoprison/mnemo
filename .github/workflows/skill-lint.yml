name: Skill lint

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - ".claude-plugin/marketplace.json"
      - ".agents/plugins/marketplace.json"
      - "config.example.json"
      - "CHANGELOG.md"
      - "scripts/lint-skills.py"
      - "scripts/test-*.py"
      - "scripts/verify-release.py"
      - ".github/workflows/skill-lint.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "plugins/**"
      - ".claude-plugin/marketplace.json"
      - ".agents/plugins/marketplace.json"
      - "config.example.json"
      - "CHANGELOG.md"
      - "scripts/lint-skills.py"
      - "scripts/test-*.py"
      - "scripts/verify-release.py"
      - ".github/workflows/skill-lint.yml"
      - ".github/workflows/release.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned runtime loaders
        run: npm install --global @anthropic-ai/claude-code@2.1.215 @openai/codex@0.144.6
      - name: Validate SKILL.md files
        run: python3 scripts/lint-skills.py
      - name: Verify release metadata
        run: python3 scripts/verify-release.py
      # One glob, not a hand-kept list: the previous per-file steps named 7 of
      # the 18 suites, so a test added with a feature was never run by CI at all
      # until someone remembered to add a step. A new scripts/test-*.py is now
      # picked up automatically.
      - name: Run the test gate
        shell: bash
        run: |
          set -uo pipefail
          status=0
          count=0
          for suite in scripts/test-*.py; do
            # fresh-install has its own step below: it needs both runtimes in
            # parallel and an extra env var.
            [ "$suite" = "scripts/test-fresh-install.py" ] && continue
            count=$((count + 1))
            echo "::group::$suite"
            if ! python3 "$suite"; then
              echo "FAILED: $suite"
              status=1
            fi
            echo "::endgroup::"
          done
          # A glob that matches nothing would otherwise report a green gate on
          # zero tests, which is indistinguishable from everything passing.
          echo "suites run: $count"
          if [ "$count" -lt 10 ]; then
            echo "expected at least 10 test suites, found $count — the glob is wrong"
            exit 1
          fi
          exit $status
      - name: Test fresh installs in both runtimes
        env:
          MNEMO_REQUIRE_RUNTIME_LOADERS: "1"
        shell: bash
        run: |
          set +e
          python3 scripts/test-fresh-install.py --runtime claude &
          claude_pid=$!
          python3 scripts/test-fresh-install.py --runtime codex &
          codex_pid=$!
          wait "$claude_pid"
          claude_status=$?
          wait "$codex_pid"
          codex_status=$?
          if (( claude_status != 0 || codex_status != 0 )); then
            echo "fresh-install failed: claude=${claude_status}, codex=${codex_status}"
            exit 1
          fi
      - name: Test session scanner graceful fallback
        run: python3 plugins/mnemo/scripts/session-scan.py
